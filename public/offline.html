<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#25f497">
  <title>Offline - HelpMesh</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      background: #09090b;
      color: #fafafa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin-bottom: 2rem;
      border-radius: 1.5rem;
      background: linear-gradient(135deg, #25f497 0%, #0d9488 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg {
      width: 40px;
      height: 40px;
      color: #000;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #fafafa;
    }
    p {
      color: #71717a;
      font-size: 0.875rem;
      line-height: 1.6;
      max-width: 320px;
      margin-bottom: 2rem;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 9999px;
      color: #f87171;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background: #f87171;
      border-radius: 50%;
    }
    button {
      background: #25f497;
      color: #000;
      border: none;
      padding: 1rem 2rem;
      border-radius: 0.75rem;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 48px;
    }
    button:hover {
      background: #1ee088;
      transform: scale(1.02);
    }
    button:active {
      transform: scale(0.98);
    }
    .tips {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid #27272a;
      color: #52525b;
      font-size: 0.75rem;
    }
    .tips ul {
      list-style: none;
      margin-top: 0.75rem;
    }
    .tips li {
      padding: 0.25rem 0;
    }
    .tips li::before {
      content: "→ ";
      color: #25f497;
    }
  </style>
</head>
<body>
  <div class="icon">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12 20h.01"/>
    </svg>
  </div>
  
  <div class="status">
    <span class="status-dot"></span>
    <span>No Connection</span>
  </div>
  
  <h1>You're Offline</h1>
  <p>
    HelpMesh needs an internet connection to process help requests and escrow payments. 
    Check your connection and try again.
  </p>
  
  <button onclick="window.location.reload()">
    Try Again
  </button>
  
  <div class="tips">
    <strong>While offline, you can:</strong>
    <ul>
      <li>Review your saved help history</li>
      <li>Check your wallet address</li>
      <li>Browse accessibility settings</li>
    </ul>
  </div>

  <script>
    // Auto-reload when back online
    window.addEventListener('online', () => {
      window.location.reload()
    })
  </script>
</body>
</html>
